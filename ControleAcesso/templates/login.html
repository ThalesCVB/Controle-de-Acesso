<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Controle de Acesso CVBMG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<div class="login-wrap"><div class="panel">
  <img src="{{ url_for('static', filename='logo.webp') }}" alt="CVBMG">
  <h1>Controle de Acesso · CVBMG</h1>
  {% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}{% endwith %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <div class="field"><label>Login</label><input name="login" autofocus autocomplete="username" required></div>
    <div class="field"><label>Senha</label><input name="senha" type="password" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%;justify-content:center">Entrar</button>
  </form>
</div></div>
</body></html>
